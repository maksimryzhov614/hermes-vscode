name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Assert exact release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use exact vMAJOR.MINOR.PATCH syntax" >&2
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx vsce package --no-dependencies --out hermes-vscode.vsix
      - name: Rename to versioned filename
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          mv hermes-vscode.vsix "hermes-vscode-$PACKAGE_VERSION.vsix"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: hermes-vscode-*.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
